name: WhisperBridge
options:
  bundleIdPrefix: com.paladinv
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
packages:
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift.git
    exactVersion: 0.1.3
targets:
  WhisperBridge:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisperBridge
    resources:
      - path: Sources/WhisperBridge/Resources
    dependencies:
      - framework: Vendor/whisper.framework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paladinv.WhisperBridge
        PRODUCT_NAME: WhisperBridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WhisperBridge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 paladinv
        CODE_SIGN_ENTITLEMENTS: Sources/WhisperBridge/WhisperBridge.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets:
        - WhisperBridgeTests
  WhisperBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WhisperBridgeTests
      - path: Sources/WhisperBridge/Domain.swift
      - path: Sources/WhisperBridge/ModelStore.swift
      - path: Sources/WhisperBridge/AudioDecoder.swift
      - path: Sources/WhisperBridge/WhisperEngine.swift
    dependencies:
      - framework: Vendor/whisper.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paladinv.WhisperBridgeTests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Vendor"
  WhisperBridgeCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/WhisperBridgeCLI
      - path: Sources/WhisperBridge/Domain.swift
      - path: Sources/WhisperBridge/AudioDecoder.swift
      - path: Sources/WhisperBridge/WhisperEngine.swift
    dependencies:
      - framework: Vendor/whisper.framework
        embed: false
      - package: MLXAudio
        product: MLXAudioSTT
    settings:
      base:
        PRODUCT_NAME: WhisperBridgeCLI
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme: {}
